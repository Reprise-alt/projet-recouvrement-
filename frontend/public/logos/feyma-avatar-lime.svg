  <circle cx="61" cy="50" r="25" fill="none" stroke="#C6FB50" stroke-width="1.4" opacity="0.30"/>
  <!-- F -->
  <path d="M51 37 H73 M51 37 V63 M51 50 H68" fill="none" stroke="#C6FB50" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
