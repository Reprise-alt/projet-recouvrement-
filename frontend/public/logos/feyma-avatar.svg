<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Feyma</title>
  <!-- Fond « îlot sombre » Neo-Cash -->
  <rect width="100" height="100" rx="22" fill="#0C120F"/>
  <!-- Lignes de vitesse (la pièce fonce vers vous) -->
  <g stroke="#C6FB50" stroke-width="5" stroke-linecap="round">
    <line x1="13" y1="38" x2="31" y2="38"/>
    <line x1="9"  y1="50" x2="31" y2="50"/>
    <line x1="15" y1="62" x2="31" y2="62"/>
  </g>
  <!-- La pièce -->
  <circle cx="61" cy="50" r="29.5" fill="#C6FB50"/>
  <!-- Liseré de pièce frappée -->
  <circle cx="61" cy="50" r="25" fill="none" stroke="#0C120F" stroke-width="1.4" opacity="0.25"/>
  <!-- F -->
  <path d="M51 37 H73 M51 37 V63 M51 50 H68" fill="none" stroke="#0C120F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
