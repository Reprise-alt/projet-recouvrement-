  <!-- Lignes de vitesse -->
  <g stroke="#0C120F" stroke-width="5" stroke-linecap="round">
    <line x1="13" y1="38" x2="31" y2="38"/>
    <line x1="9"  y1="50" x2="31" y2="50"/>
    <line x1="15" y1="62" x2="31" y2="62"/>
  </g>
  <!-- La pièce (sombre sur fond lime) -->
