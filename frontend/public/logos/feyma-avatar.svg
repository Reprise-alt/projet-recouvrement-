<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Feyma</title>
  <!-- Fond « îlot marine » (direction B « Encre & Menthe ») -->
  <rect width="100" height="100" rx="22" fill="#0E1D33"/>
  <!-- Lignes de vitesse (la pièce fonce vers vous) -->
  <g stroke="#4BD0A0" stroke-width="5" stroke-linecap="round">
    <line x1="13" y1="38" x2="31" y2="38"/>
    <line x1="9"  y1="50" x2="31" y2="50"/>
    <line x1="15" y1="62" x2="31" y2="62"/>
  </g>
  <!-- La pièce (menthe) -->
  <circle cx="61" cy="50" r="29.5" fill="#4BD0A0"/>
  <!-- Liseré de pièce frappée -->
  <circle cx="61" cy="50" r="25" fill="none" stroke="#0E1D33" stroke-width="1.4" opacity="0.3"/>
  <!-- F (marine sur la pièce menthe) -->
  <path d="M51 37 H73 M51 37 V63 M51 50 H68" fill="none" stroke="#0E1D33" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
