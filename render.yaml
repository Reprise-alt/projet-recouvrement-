databases:
  - name: recouvrement-db
    # Aligne le blueprint sur la base réelle (Basic-256mb) : Render a retiré le
    # Postgres gratuit et refuse de rétrograder un plan via blueprint, ce qui
    # bloquait la synchro (« Failed sync »). Ne PAS remettre `free`.
    plan: basic-256mb
    postgresMajorVersion: "16"

  # ── Base dédiée au SaaS self-service (isolée de la prod du groupe) ─────────
  # Les données des clients SaaS ne partagent RIEN avec la base du groupe : le
  # groupe migrera plus tard (addendum §1.9). Isolation par organisation (RLS).
  - name: olu360-saas-db
    plan: basic-256mb
    postgresMajorVersion: "16"

# Variables communes aux trois consoles front (un seul back-end / une seule
# base partagés). À renseigner une fois : elles sont héritées par les 3 sites.
envVarGroups:
  - name: olu360-frontend-shared
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ALLOW_DEV_LOGIN
        value: "false"

services:
  # ── Back-end unique, partagé par les trois consoles ───────────────────────
  - type: web
    name: recouvrement-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Les migrations additives (jamais de reset, jamais de perte) sont appliquées
    # au démarrage APRÈS l'ouverture du port (voir src/server.ts), pour ne pas
    # dépasser le délai de détection de port de Render.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recouvrement-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Liste blanche séparée par des virgules — les 3 origines des consoles :
      # https://recouvrement.olu360.com,https://operations.olu360.com,https://coursier.olu360.com
      - key: CORS_ORIGIN
        sync: false

  # ── Console Recouvrement ─────────────────────────────────────────────────
  - type: web
    name: recouvrement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: recouvrement
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ══════════════════════════════════════════════════════════════════════════
  # SaaS self-service (addendum §4-6) — STACK ISOLÉ, séparé de la prod groupe.
  # Back-end + base dédiés, mode inscription par code email (OTP), isolation
  # multi-tenant (RLS), relances automatiques de marque.
  # ══════════════════════════════════════════════════════════════════════════

  # ── SaaS : back-end dédié (OTP + RLS + relances auto) ─────────────────────
  - type: web
    name: olu360-saas-backend
    runtime: node
    rootDir: backend
    # `starter` : back-end toujours actif (plus de mise en veille). Le plan
    # `free` s'éteignait après 15 min d'inactivité → ~30-60 s de réveil à froid
    # à la 1re ouverture de la console (matin, après pause…). En production
    # payante, on ne peut pas infliger cette attente aux clients.
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    # Le serveur ouvre le port PUIS applique les migrations (voir src/server.ts) :
    # évite que la 1re application de migrations dépasse le délai de détection de
    # port de Render (« no open ports detected » → deploy failed).
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olu360-saas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Isolation multi-tenant Postgres (indispensable au SaaS).
      - key: RLS_ENABLED
        value: "true"
      # Envoi transactionnel via Resend. On privilégie l'API HTTP (`resend`) :
      # elle passe par https/443, jamais bloqué, contrairement au SMTP sortant
      # que certains hébergeurs filtrent (la connexion « pend »). La clé API est
      # lue depuis SMTP_PASS (pas de secret en double). Le nom affiché de
      # l'expéditeur est remplacé par la raison sociale de chaque client.
      # Pour repasser en SMTP : EMAIL_PROVIDER=smtp (les SMTP_* ci-dessous servent).
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: OLU 360 <relances@mail.olu360.com>
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      # Clé API Resend (secret) — à renseigner dans Render. Sert au SMTP ET à
      # l'API HTTP (le code lit RESEND_API_KEY, sinon SMTP_PASS).
      - key: SMTP_PASS
        sync: false
      # Secrets d'auth/relances générés automatiquement par Render.
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: RELANCES_CRON_SECRET
        generateValue: true
      # Origine autorisée = l'URL du front SaaS (ex. https://essai.olu360.com).
      - key: CORS_ORIGIN
        sync: false
      # Exploitant(s) plateforme : emails (séparés par des virgules) autorisés à
      # accéder au back-office d'activation des comptes (§8). À renseigner.
      - key: SUPERADMIN_EMAILS
        sync: false
      # Cabinet(s) partenaire : emails (séparés par des virgules) des avocats /
      # huissiers partenaires. Ces comptes n'appartiennent à aucune société et
      # voient, dans une console dédiée, les dossiers contentieux qui leur sont
      # confiés — toutes sociétés confondues. À renseigner.
      - key: PARTENAIRE_EMAILS
        sync: false
      # Nom d'affichage du cabinet partenaire (bandeau de sa console).
      - key: PARTENAIRE_NOM
        sync: false
      # Base de la console interne (recouvrement-db) — SOURCE de la migration de
      # tenants vers Feyma (outil back-office super-admin « Migration depuis la
      # console interne »). Mettre l'« Internal Database URL » de recouvrement-db.
      # Laisser vide tant qu'aucune migration n'est prévue.
      - key: SOURCE_DATABASE_URL
        sync: false

  # ── SaaS : front-end (inscription self-service par code email) ────────────
  - type: web
    name: olu360-saas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CONSOLE
        value: recouvrement
      - key: VITE_AUTH_MODE
        value: otp
      # URL du back-end SaaS (ex. https://olu360-saas-backend.onrender.com, ou le
      # domaine mappé). Variable de build : la renseigner puis redéployer le site.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── SaaS : cron des relances (déclencheur horaire) ────────────────────────
  # Appelle l'endpoint protégé chaque heure ; le back-end n'envoie QUE dans la
  # fenêtre 8h–19h (heure de Dakar), donc pas d'envoi nocturne.
  - type: cron
    name: olu360-saas-relances-cron
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "0 * * * *"
    buildCommand: echo "no build"
    # --retry absorbe les réveils à froid du back-end (plan `free` : ~30 s de
    # démarrage après inactivité). Sans lui, le 1er curl d'un dimanche soir
    # tombe sur un 502 transitoire → `-f` sort en code 22 → mail d'échec Render
    # pour rien. Avec, curl ré-essaie dans le même passage (5 tentatives,
    # back-off, y compris connexion refusée / erreurs HTTP) avant d'abandonner.
    startCommand: 'curl -fsS --retry 5 --retry-all-errors --retry-connrefused --retry-delay 10 --max-time 120 -X POST "https://$SAAS_BACKEND_HOST/api/cron/relances" -H "X-Cron-Secret: $CRON_SECRET"'
    envVars:
      # Hôte public du back-end SaaS, en valeur littérale : `fromService
      # property: host` renvoyait une valeur vide → curl « couldn't resolve
      # host » (exit 6) → cron en échec chaque heure. L'URL primaire est stable
      # (cf. logs Render). À mettre à jour si le back-end change d'hôte/domaine.
      - key: SAAS_BACKEND_HOST
        value: olu360-saas-backend.onrender.com
      - key: CRON_SECRET
        fromService:
          name: olu360-saas-backend
          type: web
          envVarKey: RELANCES_CRON_SECRET

  # ── SaaS : cron du rapport mensuel (envoi automatique par email) ──────────
  # Le 1er de chaque mois à 06:00 UTC : génère le PDF du mois écoulé pour chaque
  # organisation ayant renseigné une adresse de reporting et l'envoie en pièce
  # jointe. Même secret que le cron des relances.
  - type: cron
    name: olu360-saas-reporting-cron
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "0 6 1 * *"
    buildCommand: echo "no build"
    startCommand: 'curl -fsS --retry 5 --retry-all-errors --retry-connrefused --retry-delay 10 --max-time 300 -X POST "https://$SAAS_BACKEND_HOST/api/cron/reporting" -H "X-Cron-Secret: $CRON_SECRET"'
    envVars:
      - key: SAAS_BACKEND_HOST
        value: olu360-saas-backend.onrender.com
      - key: CRON_SECRET
        fromService:
          name: olu360-saas-backend
          type: web
          envVarKey: RELANCES_CRON_SECRET

  # ── SaaS : cron des avis bancaires (remises chèque / virement / espèce) ────
  # Chaque matin à 06:00 UTC (= 06:00 Dakar) : pour chaque organisation ayant
  # connecté sa boîte « avis bancaires », lit les nouveaux avis de sa banque et
  # les pré-rapproche par montant. Idempotent (dédup par identifiant de message),
  # donc sans risque de doublon si le passage rejoue. Même secret que les relances.
  - type: cron
    name: olu360-saas-remises-cron
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: echo "no build"
    startCommand: 'curl -fsS --retry 5 --retry-all-errors --retry-connrefused --retry-delay 10 --max-time 300 -X POST "https://$SAAS_BACKEND_HOST/api/cron/remises" -H "X-Cron-Secret: $CRON_SECRET"'
    envVars:
      - key: SAAS_BACKEND_HOST
        value: olu360-saas-backend.onrender.com
      - key: CRON_SECRET
        fromService:
          name: olu360-saas-backend
          type: web
          envVarKey: RELANCES_CRON_SECRET

  # ── Console Opérations ───────────────────────────────────────────────────
  - type: web
    name: operations-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: operations
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Console Coursier ─────────────────────────────────────────────────────
  - type: web
    name: coursier-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: coursier
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
