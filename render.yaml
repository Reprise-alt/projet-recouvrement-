databases:
  - name: recouvrement-db
    # Aligne le blueprint sur la base réelle (Basic-256mb) : Render a retiré le
    # Postgres gratuit et refuse de rétrograder un plan via blueprint, ce qui
    # bloquait la synchro (« Failed sync »). Ne PAS remettre `free`.
    plan: basic-256mb
    postgresMajorVersion: "16"

  # ── Base dédiée au SaaS self-service (isolée de la prod du groupe) ─────────
  # Les données des clients SaaS ne partagent RIEN avec la base du groupe : le
  # groupe migrera plus tard (addendum §1.9). Isolation par organisation (RLS).
  - name: olu360-saas-db
    plan: basic-256mb
    postgresMajorVersion: "16"

# Variables communes aux trois consoles front (un seul back-end / une seule
# base partagés). À renseigner une fois : elles sont héritées par les 3 sites.
envVarGroups:
  - name: olu360-frontend-shared
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ALLOW_DEV_LOGIN
        value: "false"

services:
  # ── Back-end unique, partagé par les trois consoles ───────────────────────
  - type: web
    name: recouvrement-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # prisma migrate deploy applique les migrations additives au démarrage
    # (dont accesPlanningCoursiers) — jamais de reset, jamais de perte.
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recouvrement-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Liste blanche séparée par des virgules — les 3 origines des consoles :
      # https://recouvrement.olu360.com,https://operations.olu360.com,https://coursier.olu360.com
      - key: CORS_ORIGIN
        sync: false

  # ── Console Recouvrement ─────────────────────────────────────────────────
  - type: web
    name: recouvrement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: recouvrement
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ══════════════════════════════════════════════════════════════════════════
  # SaaS self-service (addendum §4-6) — STACK ISOLÉ, séparé de la prod groupe.
  # Back-end + base dédiés, mode inscription par code email (OTP), isolation
  # multi-tenant (RLS), relances automatiques de marque.
  # ══════════════════════════════════════════════════════════════════════════

  # ── SaaS : back-end dédié (OTP + RLS + relances auto) ─────────────────────
  - type: web
    name: olu360-saas-backend
    runtime: node
    rootDir: backend
    # `free` dort après inactivité (démarrage à froid ~30 s). Passer à `starter`
    # pour un back-end toujours actif en production.
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olu360-saas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Isolation multi-tenant Postgres (indispensable au SaaS).
      - key: RLS_ENABLED
        value: "true"
      # Envoi transactionnel via Resend (SMTP). Le nom affiché de l'expéditeur
      # est remplacé par la raison sociale de chaque client à l'envoi.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        value: OLU 360 <relances@mail.olu360.com>
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      # Clé API Resend (secret) — à renseigner dans Render.
      - key: SMTP_PASS
        sync: false
      # Secrets d'auth/relances générés automatiquement par Render.
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: RELANCES_CRON_SECRET
        generateValue: true
      # Origine autorisée = l'URL du front SaaS (ex. https://essai.olu360.com).
      - key: CORS_ORIGIN
        sync: false

  # ── SaaS : front-end (inscription self-service par code email) ────────────
  - type: web
    name: olu360-saas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CONSOLE
        value: recouvrement
      - key: VITE_AUTH_MODE
        value: otp
      # URL du back-end SaaS (ex. https://olu360-saas-backend.onrender.com, ou le
      # domaine mappé). Variable de build : la renseigner puis redéployer le site.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── SaaS : cron des relances (déclencheur horaire) ────────────────────────
  # Appelle l'endpoint protégé chaque heure ; le back-end n'envoie QUE dans la
  # fenêtre 8h–19h (heure de Dakar), donc pas d'envoi nocturne.
  - type: cron
    name: olu360-saas-relances-cron
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "0 * * * *"
    buildCommand: echo "no build"
    startCommand: 'curl -fsS -X POST "https://$SAAS_BACKEND_HOST/api/cron/relances" -H "X-Cron-Secret: $CRON_SECRET"'
    envVars:
      - key: SAAS_BACKEND_HOST
        fromService:
          name: olu360-saas-backend
          type: web
          property: host
      - key: CRON_SECRET
        fromService:
          name: olu360-saas-backend
          type: web
          envVarKey: RELANCES_CRON_SECRET

  # ── Console Opérations ───────────────────────────────────────────────────
  - type: web
    name: operations-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: operations
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Console Coursier ─────────────────────────────────────────────────────
  - type: web
    name: coursier-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: olu360-frontend-shared
      - key: VITE_CONSOLE
        value: coursier
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
