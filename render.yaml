databases:
  - name: recouvrement-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: recouvrement-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recouvrement-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: recouvrement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ALLOW_DEV_LOGIN
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
